name: universtree
description: "The Operating System for Campus Life - Multi-tenant Flutter app for students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_app_check: ^0.3.1+3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  go_router: ^14.8.0
  http: ^1.2.2
  file_picker: ^8.1.7
  mailer: ^7.2.0
  flutter_dotenv: ^5.2.1
  google_maps_flutter: ^2.10.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
